<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farming Automation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
    <div class="language-dock" aria-label="Language selector">
        <span class="language-label" data-i18n="languageLabel">Language</span>
        <button class="lang-btn active" type="button" onclick="setLanguage('en')" data-lang="en">EN</button>
        <button class="lang-btn" type="button" onclick="setLanguage('mr')" data-lang="mr">मर</button>
        <button class="lang-btn" type="button" onclick="setLanguage('hi')" data-lang="hi">हि</button>
    </div>

    <main class="container">
        <section class="auth-shell">
            <div class="hero-panel">
                <div class="eyebrow hero-eyebrow" data-i18n="dashboardEyebrow">Smart Farming Automation</div>
                <h1 data-i18n="appTitle">Smart Farming Automation</h1>
                <p data-i18n="loginSubtitle">Sign in to monitor irrigation, moisture and sunlight.</p>
            </div>

            <form class="auth-card" id="auth-form" onsubmit="event.preventDefault(); submitAuthForm();">
                <div class="auth-tabs" role="tablist" aria-label="Account action">
                    <button class="auth-tab active" type="button" data-auth-mode="login" onclick="setAuthMode('login')" data-i18n="loginTab">Login</button>
                    <button class="auth-tab" type="button" data-auth-mode="register" onclick="setAuthMode('register')" data-i18n="registerTab">New Account</button>
                </div>
                <h2 id="auth-title" data-i18n="loginTitle">Welcome Back</h2>
                <p id="auth-copy" data-i18n="loginSubtitle">Sign in to monitor irrigation, moisture and sunlight.</p>
                <div class="field">
                    <input type="text" id="username" data-i18n-placeholder="accountUsernamePlaceholder" placeholder="Username" value="viraj" autocomplete="username">
                </div>
                <div class="field">
                    <input type="password" id="password" data-i18n-placeholder="accountPasswordPlaceholder" placeholder="Password" value="Viraj2112" autocomplete="current-password">
                </div>
                <div class="field" data-register-only hidden>
                    <input type="password" id="confirm-password" data-i18n-placeholder="confirmPasswordPlaceholder" placeholder="Confirm password" autocomplete="new-password">
                </div>
                <button class="primary-btn full-width" id="auth-submit" type="submit" data-i18n="accessSystem">Access System</button>
                <div class="auth-message" id="auth-message" role="alert" hidden></div>
            </form>
        </section>
    </main>

   <script type="module" src="app.js"></script>
</body>
</html>
